name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-latest

    env:
      SCHEME: DragonIsland
      PROJECT: DragonIsland.xcodeproj
      APP_NAME: DragonIsland
      DERIVED_DATA: build/DerivedData

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify project and scheme
        run: xcodebuild -list -project "$PROJECT"

      # Unsigned Release build. This compiles every Swift file and the asset
      # catalog for a real device without needing any Apple credentials.
      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry "$APP_NAME-unsigned.ipa" Payload
          echo "Packaged build/$APP_NAME-unsigned.ipa (unsigned, sideload only)."

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: DragonIsland-unsigned-ipa
          path: build/DragonIsland-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

